{% extends "base.html" if g.user else "plain.html" %}
{% block title %}Error{% endblock %}
{% block content %}<div class="card" style="max-width:520px"><h1 class="gold">{{ code }}</h1><p style="font-size:1.1rem">{{ msg }}</p>{% if detail %}<pre style="white-space:pre-wrap;font-size:.8rem;overflow:auto">{{ detail }}</pre>{% endif %}<a class="btn" href="{{ url_for("index") }}">Back to the portal</a></div>{% endblock %}
